name: build-vpk

on:
  pull_request:
  push:
    branches: ["**"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression, player, core, recovery and HTTP tests
        run: sh tools/run-tests.sh
  build:
    needs: tests
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk@sha256:fd82d88ff456d118eef16533ebf9a3a6ae0e292684fb8a3a35f15f0707b4692d
    steps:
      - uses: actions/checkout@v4

      - name: Check sce_sys PNG format (must be 8-bit palette)
        run: |
          python3 -c "
          import struct, sys
          bad = False
          for f in ['sce_sys/icon0.png','sce_sys/livearea/contents/startup.png','sce_sys/livearea/contents/bg.png']:
              d = open(f,'rb').read()
              w,h,bd,ct = struct.unpack('>IIBB',d[16:26])
              ok = (bd,ct) == (8,3)
              print(f, 'depth', bd, 'type', ct, 'OK' if ok else 'REJECT')
              bad = bad or not ok
          sys.exit(1 if bad else 0)
          "

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake

      - name: Build
        run: cmake --build build

      - name: Validate ELF load layout
        run: python3 tools/check-elf.py build/vita-plex-client

      - name: Dump ELF layout (debug)
        if: failure()
        run: |
          arm-vita-eabi-gcc --version
          arm-vita-eabi-readelf -l build/vita-plex-client | head -30
          arm-vita-eabi-readelf -S build/vita-plex-client | head -40

      - name: Release VPK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.vpk

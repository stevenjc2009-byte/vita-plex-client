name: build-vpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake

      - name: Build
        run: cmake --build build

      - name: Dump ELF layout (debug)
        if: failure()
        run: |
          arm-vita-eabi-gcc --version
          arm-vita-eabi-readelf -l build/vita-plex-client | head -30
          arm-vita-eabi-readelf -S build/vita-plex-client | head -40

      - name: Release VPK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.vpk
